name: "Obstruction Auto-Retract Test"
description: "Tests that door auto-retracts when it closes onto an obstruction"
steps:
  - action: set
    name: autoretract
    value: "on"
  - action: set
    name: hold_time
    value: "1"
  - action: trigger
    sensor: inside
  - action: wait_for
    condition: door_status
    equals: DOOR_HOLDING
    timeout: 5
  # Placed while the door is up, the way a real obstruction gets there. An
  # obstruction is not a sensor, so this does not stop the close from
  # starting - the door travels down and meets it at the bottom. Arming it
  # here rather than mid-close also removes a race against closing_mid_time.
  - action: obstruction
  - action: log
    message: "Obstruction placed, waiting for the door to close onto it..."
  - action: wait_for
    condition: door_closing
    timeout: 10
  - action: wait_for
    condition: door_open
    timeout: 5
  # A one-shot obstruction is cleared by the retract it causes.
  - action: assert
    condition: obstruction
    equals: "off"
  - action: assert
    condition: total_auto_retracts
    equals: "1"
  - action: log
    message: "Auto-retract successful!"
