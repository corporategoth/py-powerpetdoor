name: "Outside Sensor Safety Lock Test"
description: "Tests that the safety lock lets a pet in past a closed schedule window"
steps:
  - action: set
    name: hold_time
    value: 1
  # The vendor app calls this switch "always allow pet entry inside
  # override timers". The wire name reads like an interlock ON the outside
  # sensor, and this script used to assert that reading - that a locked
  # door refuses the outside sensor. It is the opposite: the lock GRANTS
  # entry, overriding the schedule.
  - action: add_schedule
    index: 0
    enabled: true
  - action: set
    name: safety_lock
    value: off
  - action: trigger
    sensor: outside
  - action: wait_for
    condition: door_open
    timeout: 5
  - action: log
    message: "Inside its window, the outside sensor opens the door"
  - action: wait_for
    condition: door_closed
    timeout: 15
  - action: set
    name: safety_lock
    value: on
  - action: trigger
    sensor: outside
  - action: wait_for
    condition: door_open
    timeout: 5
  - action: log
    message: "With the lock on, the pet is let in regardless - correct!"
  - action: wait_for
    condition: door_closed
    timeout: 15
  - action: set
    name: safety_lock
    value: off
