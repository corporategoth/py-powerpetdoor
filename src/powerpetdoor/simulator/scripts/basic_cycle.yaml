name: "Basic Door Cycle"
description: "Pet triggers inside sensor, door opens, holds, then closes"
steps:
  - action: assert
    condition: door_status
    equals: DOOR_CLOSED
  - action: set
    name: hold_time
    value: "1"
  - action: trigger_sensor
    sensor: inside
  # trigger_sensor starts the door rising synchronously
  - action: assert
    condition: door_status
    equals: DOOR_RISING
  - action: wait_for
    condition: door_holding
    timeout: 5
  - action: wait_for
    condition: door_closed
    timeout: 10
  - action: log
    message: "Door cycle completed successfully"
