name: "Power and Lockout Test"
description: "Tests that commands are blocked when power off or lockout enabled"
steps:
  - action: log
    message: "Testing power off behavior..."
  - action: set
    name: power
    value: "off"
  # An ignored trigger leaves the door closed immediately (no wait needed)
  - action: trigger
    sensor: inside
  # A switched-off door reports DOOR_POWEROFF rather than DOOR_CLOSED, so
  # the state is asserted both ways: the exact string the wire carries, and
  # the question a caller actually asks.
  - action: assert
    condition: door_status
    equals: DOOR_POWEROFF
  - action: assert
    condition: door_closed
    equals: true
  - action: log
    message: "Door stayed closed with power off - correct!"
  - action: set
    name: power
    value: "on"
  - action: log
    message: "Testing command lockout..."
  - action: set
    name: cmd_lockout
    value: "on"
  - action: trigger
    sensor: inside
  - action: assert
    condition: door_status
    equals: DOOR_CLOSED
  - action: log
    message: "Door stayed closed with lockout - correct!"
  - action: set
    name: cmd_lockout
    value: "off"
