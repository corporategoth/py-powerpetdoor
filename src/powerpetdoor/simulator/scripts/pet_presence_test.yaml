name: "Pet Presence Hold Extension"
description: "Tests that pet in doorway keeps the door open past its hold time"
steps:
  - action: set
    name: hold_time
    value: "1"
  - action: trigger
    sensor: inside
  - action: wait_for
    condition: door_status
    equals: DOOR_HOLDING
    timeout: 5
  - action: inside
    duration: 0
  - action: log
    message: "Pet detected - door must stay open"
  # Genuine time passage: wait past the 1s hold time to prove the pet
  # presence is what keeps the door open.
  - action: wait
    seconds: 1.5
  - action: assert
    condition: door_status
    equals: DOOR_HOLDING
  - action: inside
    state: off
  - action: log
    message: "Pet left - door should close after hold time"
  - action: wait_for
    condition: door_closed
    timeout: 10
