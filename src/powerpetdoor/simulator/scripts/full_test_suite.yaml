name: "Full Test Suite"
description: "Comprehensive test of all simulator features"
steps:
  # Test 1: Basic cycle
  - action: log
    message: "=== Test 1: Basic Door Cycle ==="
  - action: set
    name: hold_time
    value: "1"
  - action: trigger
    sensor: inside
  - action: wait_for
    condition: door_open
    timeout: 5
  - action: wait_for
    condition: door_closed
    timeout: 10
  - action: log
    message: "Basic cycle: PASSED"

  # Test 2: Outside sensor
  - action: log
    message: "=== Test 2: Outside Sensor ==="
  - action: trigger
    sensor: outside
  - action: wait_for
    condition: door_open
    timeout: 5
  - action: wait_for
    condition: door_closed
    timeout: 10
  - action: log
    message: "Outside sensor: PASSED"

  # Test 3: Power off (an ignored trigger leaves the door closed immediately)
  - action: log
    message: "=== Test 3: Power Off ==="
  - action: set
    name: power
    value: "off"
  - action: trigger
    sensor: inside
  # DOOR_POWEROFF, not DOOR_CLOSED: a switched-off door reports its own
  # state rather than any of the motion states. The flap is still down -
  # the trigger was ignored, which is what this is testing.
  - action: assert
    condition: door_status
    equals: DOOR_POWEROFF
  - action: assert
    condition: door_closed
    equals: true
  - action: set
    name: power
    value: "on"
  - action: log
    message: "Power off: PASSED"

  # Test 4: Safety lock - the app's "always allow pet entry inside override
  # timers". It GRANTS entry past the schedule; the wire name reads like an
  # interlock and this suite used to assert that, wrongly.
  - action: log
    message: "=== Test 4: Safety Lock ==="
  - action: add_schedule
    index: 0
    enabled: true
  - action: set
    name: safety_lock
    value: on
  - action: trigger
    sensor: outside
  - action: wait_for
    condition: door_open
    timeout: 5
  - action: wait_for
    condition: door_closed
    timeout: 15
  - action: set
    name: safety_lock
    value: off
  - action: remove_schedule
    index: 0
  - action: log
    message: "Safety lock: PASSED"

  # Test 5: Open and hold
  - action: log
    message: "=== Test 5: Open and Hold ==="
  - action: open
  - action: wait_for
    condition: door_status
    equals: DOOR_KEEPUP
    timeout: 5
  # Genuine time passage: stay past the 1s hold time to prove KEEPUP
  # does not auto-close.
  - action: wait
    seconds: 1.5
  - action: assert
    condition: door_status
    equals: DOOR_KEEPUP
  - action: close
  - action: wait_for
    condition: door_closed
    timeout: 10
  - action: log
    message: "Open and hold: PASSED"

  - action: log
    message: "=== All tests PASSED ==="
