[build-system]
# Pinned exactly, not floored: `uv build`'s default build isolation installs
# these from PyPI *inside* the release job that holds `id-token: write`, so a
# hijacked setuptools/wheel release would be executing in the job that signs
# and publishes the artifact.
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypowerpetdoor"
version = "0.4.2"
description = "Python library for communicating with Power Pet Door devices"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Preston Elder", email = "prez@neuromancy.net"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    # The library itself is portable, but the simulator's plain-stdin prompt
    # fallback uses loop.add_reader() on stdin, which Windows'
    # ProactorEventLoop does not implement. CI is Linux-only, so claiming
    # "OS Independent" would be an untested claim.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
keywords = ["power pet door", "pet door", "home automation", "iot"]
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
interactive = [
    "prompt_toolkit>=3.0.0",
]
simulator = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=5.0.0",
    # Suite-wide backstop: a regression that deadlocks must fail the build,
    # not occupy the shared runner until the 6-hour job timeout.
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0.0",
    # Static analysis
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    # Runs the hooks in .pre-commit-config.yaml; installed by
    # scripts/setup-dev.sh, which is what a fresh clone should run.
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/corporategoth/py-powerpetdoor"
Repository = "https://github.com/corporategoth/py-powerpetdoor"
Issues = "https://github.com/corporategoth/py-powerpetdoor/issues"

[project.scripts]
ppd-simulator = "powerpetdoor.simulator.cli:main"
ppd-simulator-ctl = "powerpetdoor.simulator.ctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"powerpetdoor.simulator" = ["scripts/*.yaml", "scripts/*.yml"]
# Locale files must reach the wheel, or `t()` silently renders English
# everywhere once installed - the one failure mode i18n packaging has.
"powerpetdoor" = ["locales/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"
filterwarnings = ["error"]
# Backstop against a deadlock regression. The whole suite runs in ~25 s and
# the slowest single test is well under a second, so a 60 s per-test cap can
# only ever fire on a genuine hang. Individual awaits that can deadlock are
# additionally bounded in the tests themselves, so the usual failure is a
# clear assertion rather than this.
timeout = 60
# ...and it must cover tests/fuzz/ too, which is the half where a novel
# input finds a novel hang. pytest-timeout's default "signal" method raises
# inside the running test frame; hypothesis catches whatever the body raises
# and re-invokes it to shrink, but the one-shot SIGALRM is spent, so every
# shrink attempt re-enters the hang with no alarm armed and the process
# spins forever. Measured: an infinite-loop mutation in FrameScanner.feed
# failed a plain test at 60 s and produced *zero output in 150 s* from the
# identical hang inside @given - under the real `-n auto` addopts as well as
# `-n0`. The thread method runs its timer off-thread, dumps every stack and
# calls os._exit(), so hypothesis cannot swallow it, and it names the
# hanging line. Zero cost on a passing run (round-7 test-fanatic M1).
timeout_method = "thread"

[tool.coverage.run]
source = ["src/powerpetdoor"]
branch = true
parallel = true
omit = [
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2
# Every pattern here is a `re.search` against the WHOLE source line, so a
# bare phrase matches docstrings, f-strings and dict keys exactly as
# readily as the construct it names - which silently drops real statements
# out of the gate. Anchor instead: comment patterns to an actual comment,
# and structural patterns to the start of a line.
exclude_lines = [
    "#\\s*pragma:\\s*no\\s+cover\\s*($|\\()",
    "^\\s*def __repr__",
    "^\\s*raise NotImplementedError",
    "^\\s*if TYPE_CHECKING:",
    "^\\s*if __name__ == .__main__.:",
    "^\\s*@overload\\s*$",
    # Ellipsis *stub bodies* only. A bare `\.\.\.` is a `re.search` against the
    # whole source line, so it also matches log strings, comments and
    # `tuple[str, ...]` annotations.
    "(^\\s*\\.\\.\\.\\s*$)|(:\\s*\\.\\.\\.\\s*$)",
]
# Leaving this unset does not mean "no branch exclusions": it means
# coverage's own default, `#\s*(pragma|PRAGMA)[:\s]?\s*(no|NO)\s*(branch|
# BRANCH)`, which is a bare unanchored `re.search` and therefore forgives a
# missing branch arc on any line that merely *mentions* the phrase.
# Anchored the same way the pragma pattern above is.
partial_branches = [
    "#\\s*pragma:\\s*no\\s+branch\\s*($|\\()",
]

[tool.coverage.paths]
source = [
    "src/powerpetdoor",
    "*/src/powerpetdoor",
]

[tool.coverage.html]
directory = "coverage_html"
title = "pypowerpetdoor Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    # Line too long - protocol constants and messages read better unwrapped
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Test files use long literal protocol payloads and mock class names
"tests/**/*.py" = ["E501", "N806"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
