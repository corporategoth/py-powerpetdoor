[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypowerpetdoor"
version = "0.3.0"
description = "Python library for communicating with Power Pet Door devices"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Preston Elder", email = "prez@neuromancy.net"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
keywords = ["power pet door", "pet door", "home automation", "iot"]
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
interactive = [
    "prompt_toolkit>=3.0.0",
]
simulator = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0.0",
    # Static analysis
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/corporategoth/py-powerpetdoor"
Repository = "https://github.com/corporategoth/py-powerpetdoor"
Issues = "https://github.com/corporategoth/py-powerpetdoor/issues"

[project.scripts]
ppd-simulator = "powerpetdoor.simulator.cli:main"
ppd-simulator-ctl = "powerpetdoor.simulator.ctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"powerpetdoor.simulator" = ["scripts/*.yaml", "scripts/*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"

[tool.coverage.run]
source = ["src/powerpetdoor"]
branch = true
parallel = true
omit = [
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.paths]
source = [
    "src/powerpetdoor",
    "*/src/powerpetdoor",
]

[tool.coverage.html]
directory = "coverage_html"
title = "pypowerpetdoor Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    # Line too long - protocol constants and messages read better unwrapped
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Test files use long literal protocol payloads and mock class names
"tests/**/*.py" = ["E501", "N806"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
