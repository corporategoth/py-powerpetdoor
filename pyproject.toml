[build-system]
# Pinned exactly, not floored: `uv build`'s default build isolation installs
# these from PyPI *inside* the release job that holds `id-token: write`, so a
# hijacked setuptools/wheel release would be executing in the job that signs
# and publishes the artifact.
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pypowerpetdoor"
version = "0.3.0"
description = "Python library for communicating with Power Pet Door devices"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Preston Elder", email = "prez@neuromancy.net"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    # The library itself is portable, but the simulator's plain-stdin prompt
    # fallback uses loop.add_reader() on stdin, which Windows'
    # ProactorEventLoop does not implement. CI is Linux-only, so claiming
    # "OS Independent" would be an untested claim.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
keywords = ["power pet door", "pet door", "home automation", "iot"]
dependencies = [
    "tzdata>=2024.1",
]

[project.optional-dependencies]
interactive = [
    "prompt_toolkit>=3.0.0",
]
simulator = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=5.0.0",
    # Suite-wide backstop: a regression that deadlocks must fail the build,
    # not occupy the shared runner until the 6-hour job timeout.
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0.0",
    # Static analysis
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/corporategoth/py-powerpetdoor"
Repository = "https://github.com/corporategoth/py-powerpetdoor"
Issues = "https://github.com/corporategoth/py-powerpetdoor/issues"

[project.scripts]
ppd-simulator = "powerpetdoor.simulator.cli:main"
ppd-simulator-ctl = "powerpetdoor.simulator.ctl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"powerpetdoor.simulator" = ["scripts/*.yaml", "scripts/*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"
filterwarnings = ["error"]
# Backstop against a deadlock regression. The whole suite runs in ~25 s and
# the slowest single test is well under a second, so a 60 s per-test cap can
# only ever fire on a genuine hang. Individual awaits that can deadlock are
# additionally bounded in the tests themselves, so the usual failure is a
# clear assertion rather than this.
timeout = 60

[tool.coverage.run]
# `scripts/` is in scope too: generate_gaps_report.py produces the artifact
# this project uses to report its own testing gaps, so it must participate
# in the 100% gate like everything else.
source = ["src/powerpetdoor", "scripts"]
branch = true
parallel = true
omit = [
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.paths]
source = [
    "src/powerpetdoor",
    "*/src/powerpetdoor",
]
scripts = [
    "scripts",
    "*/scripts",
]

[tool.coverage.html]
directory = "coverage_html"
title = "pypowerpetdoor Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    # Line too long - protocol constants and messages read better unwrapped
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Test files use long literal protocol payloads and mock class names
"tests/**/*.py" = ["E501", "N806"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
