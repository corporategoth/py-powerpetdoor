name: Release

on:
  release:
    types: [published]

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only run on GitHub, not Gitea — PyPI publishing uses GitHub OIDC.
    if: ${{ vars.GITEA_ACTIONS != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      # Resolve from the committed, hashed uv.lock rather than fresh from
      # PyPI - this is the job that gates a publish.
      - name: Install dependencies
        run: uv sync --locked --all-extras && echo "$(pwd)/.venv/bin" >> $GITHUB_PATH && echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV
      - name: Run tests
        run: pytest --ignore=tests/fuzz -q

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.GITEA_ACTIONS != 'true' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
      # The build backend is pinned exactly in [build-system] requires, so
      # `uv build`'s isolated build environment cannot pull an arbitrary
      # setuptools/wheel from PyPI into the job that holds id-token: write.
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
